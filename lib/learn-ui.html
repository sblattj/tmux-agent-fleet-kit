<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LEARN</title>
<style>
  :root { --bg:#0f1418; --card:#18212a; --line:#2a3642; --fg:#e6edf3; --dim:#8b98a5; --ok:#3fb68b;
          --warn:#e3b341; --bad:#f85149; --info:#58a6ff; --fleet:#58a6ff; --outside:#d2a8ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg);
         color:var(--fg); }
  header { position:sticky; top:0; z-index:2; display:flex; gap:12px; align-items:center; padding:12px 20px;
           background:#0b1014ee; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; letter-spacing:.06em; }
  header .meta { color:var(--dim); font-size:13px; }
  header .sp { flex:1; }
  button { font:inherit; color:var(--fg); background:#223040; border:1px solid var(--line); border-radius:8px;
           padding:7px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--info); }
  button:disabled { opacity:.38; cursor:default; }
  main { max-width:980px; margin:0 auto; padding:18px 20px 80px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); margin:26px 0 10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:0 0 12px; }
  .origin { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid; white-space:nowrap; }
  .o-fleet { color:var(--fleet); } .o-outside { color:var(--outside); }
  .big { font-size:28px; font-weight:700; }
  .dim { color:var(--dim); font-size:13px; }
  .bar { height:6px; background:#0b1014; border-radius:99px; overflow:hidden; margin:8px 0 4px; }
  .bar i { display:block; height:100%; background:var(--ok); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  svg.spark { display:block; }
  .top { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; color:var(--dim); font-size:13px; }
  .top .id { color:var(--fg); font-weight:700; font-size:14px; }
  .q { margin:6px 0 10px; font-size:16px; white-space:pre-wrap; }
  .opt { display:flex; width:100%; text-align:left; gap:10px; margin:6px 0; padding:9px 12px; }
  .opt .l { font-weight:700; min-width:1.2em; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .row input { flex:1; min-width:240px; font:inherit; color:var(--fg); background:#0f1418; border:1px solid var(--line);
               border-radius:8px; padding:8px 10px; }
  .quote { font-style:italic; white-space:pre-wrap; border-left:3px solid var(--line); padding-left:10px; margin:8px 0; }
  .pass { color:var(--ok); font-weight:700; } .fail { color:var(--bad); font-weight:700; }
  .empty { color:var(--dim); padding:14px 0; }
  .err { color:var(--bad); }
  .heardtag { color:var(--dim); font-style:italic; }
  .src { color:var(--dim); font-size:12px; }
  select { font:inherit; color:var(--fg); background:#0f1418; border:1px solid var(--line); border-radius:8px; padding:7px; }
  pre.quote { font-style:normal; font-size:13px; max-height:420px; overflow:auto; }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>LEARN</h1>
  <span class="meta" id="meta">loading</span>
  <span class="sp"></span>
  <button id="reload">Reload</button>
</header>
<main>
  <div class="grid" id="origins"></div>

  <h2>Lesson</h2>
  <div id="lesson"></div>

  <h2>Quiz</h2>
  <div id="quiz"></div>

  <h2>Session on one topic</h2>
  <div class="card" id="session">
    <div class="row"><input id="session-topic" placeholder="topic, ticket or entity (as in fleet learn session --topic)">
      <button id="session-go">Start session</button></div>
    <div id="session-body"></div>
  </div>

  <h2>Every pane command</h2>
  <div class="card" id="pane">
    <div class="dim">Runs a <code>fleet learn</code> command exactly as the pane does and shows its text.</div>
    <div class="row"><select id="pane-verb"></select><input id="pane-args" placeholder="arguments, e.g. --since 3d --preview">
      <button id="pane-go">Run</button></div>
    <pre id="pane-out" class="quote"></pre>
  </div>

  <h2>Score history per topic</h2>
  <div class="card"><table id="topics"></table></div>

  <h2>Heard only (not taught as decided)</h2>
  <div id="heard"></div>

  <h2>Recent reviews</h2>
  <div class="card"><table id="recent"></table></div>
</main>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
let STATE = null, current = null, shownAt = 0;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k) n.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
  return n;
}
function clear(n) { n.innerHTML = ""; }
function originTag(o) { return el("span", { class: "origin o-" + (o === "outside" ? "outside" : "fleet"), text: o }); }
const ORIGIN_TEXT = { fleet: "we decided or shipped it", outside: "someone else changed it" };

async function api(path, body) {
  const r = await fetch(path + (body ? "" : (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN)), {
    method: body ? "POST" : "GET", headers: { "X-Fleet-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("http " + r.status));
  return j;
}

function spark(points) {
  const W = 180, H = 34, n = points.length;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "spark"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const xy = points.map((p, i) => [n === 1 ? W / 2 : 4 + i * (W - 8) / (n - 1), H - 4 - (p.score / 100) * (H - 8)]);
  if (n > 1) {
    const pl = document.createElementNS(ns, "polyline");
    pl.setAttribute("points", xy.map(a => a.join(",")).join(" "));
    pl.setAttribute("fill", "none"); pl.setAttribute("stroke", "#3fb68b"); pl.setAttribute("stroke-width", "2");
    svg.appendChild(pl);
  }
  xy.forEach(([x, y], i) => {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 2.5); c.setAttribute("fill", "#e6edf3");
    const t = document.createElementNS(ns, "title");
    t.textContent = points[i].day + ": " + points[i].passes + " of " + points[i].reviews + " passed";
    c.appendChild(t); svg.appendChild(c);
  });
  return svg;
}

function renderOrigins(s) {
  const box = document.getElementById("origins"); clear(box);
  for (const o of ["fleet", "outside"]) {
    const b = s.byOrigin[o] || { items: 0, learned: 0, due: 0, heard: 0, confirmed: 0 };
    const pct = b.items ? Math.round(100 * b.learned / b.items) : 0;
    box.appendChild(el("div", { class: "card" },
      el("div", { class: "top" }, originTag(o), el("span", { text: ORIGIN_TEXT[o] })),
      el("div", { class: "big", text: b.learned + " of " + b.items + " learned" }),
      el("div", { class: "bar" }, el("i", { style: "width:" + pct + "%" })),
      el("div", { class: "dim", text: b.due + " due, " + b.confirmed + " confirmed, " + b.heard + " heard only" })));
  }
}

function renderTopics(st) {
  const t = document.getElementById("topics"); clear(t);
  t.appendChild(el("tr", {}, el("th", { text: "topic" }), el("th", { text: "origin" }),
    el("th", { text: "learned" }), el("th", { text: "daily quiz score" }), el("th", { text: "last" })));
  const hist = {};
  for (const h of st.history) hist[h.origin + "\u0000" + h.topic] = h.points;
  if (!st.snapshot.topics.length) {
    t.appendChild(el("tr", {}, el("td", { colspan: 5, class: "empty", text: "No ledger rows yet." })));
  }
  for (const tp of st.snapshot.topics) {
    const pts = hist[tp.origin + "\u0000" + tp.topic] || [];
    const last = pts[pts.length - 1];
    t.appendChild(el("tr", { "data-topic": tp.topic },
      el("td", { text: tp.topic || "(none)" }), el("td", {}, originTag(tp.origin)),
      el("td", { text: tp.learned + " of " + tp.items + " (" + tp.pct + "%)" }),
      el("td", {}, pts.length ? spark(pts) : el("span", { class: "dim", text: "no reviews yet" })),
      el("td", { class: "dim", text: last ? last.day + ": " + last.score + "%" : "" })));
  }
}

function renderHeard(s) {
  const box = document.getElementById("heard"); clear(box);
  if (!s.heard.length) { box.appendChild(el("div", { class: "empty", text: "None." })); return; }
  for (const h of s.heard) {
    const src = h.source || {};
    box.appendChild(el("div", { class: "card" },
      el("div", { class: "top" }, el("span", { class: "id", text: h.lid }),
        el("span", { text: (src.type || "") + " " + (src.ref || "") })),
      el("div", { class: "quote", text: h.quote })));
  }
}

function renderRecent(s) {
  const t = document.getElementById("recent"); clear(t);
  t.appendChild(el("tr", {}, el("th", { text: "at" }), el("th", { text: "card" }), el("th", { text: "format" }),
    el("th", { text: "origin" }), el("th", { text: "grade" })));
  const rows = s.recent.slice().reverse();
  if (!rows.length) t.appendChild(el("tr", {}, el("td", { colspan: 5, class: "empty", text: "No reviews yet." })));
  for (const r of rows) {
    t.appendChild(el("tr", {}, el("td", { class: "dim", text: r.at }), el("td", { text: r.cid + " " + r.lid }),
      el("td", { text: r.format }), el("td", {}, r.origin ? originTag(r.origin) : null),
      el("td", { class: r.grade === "pass" ? "pass" : "fail", text: r.grade })));
  }
}

function renderQuiz(list, boxId, after) {
  const box = document.getElementById(boxId || "quiz"); clear(box);
  const q = list || STATE.quiz;
  const next = after || (() => { current = null; load(); });
  if (!q.length) { box.appendChild(el("div", { class: "empty", text: "Nothing due." })); current = null; return; }
  if (!current || !q.find(c => c.cid === current.cid)) { current = q[0]; shownAt = Date.now(); }
  const c = current;
  const card = el("div", { class: "card", id: "card-" + c.cid },
    el("div", { class: "top" }, el("span", { class: "id", text: c.cid }), el("span", { text: c.lid }),
      el("span", { text: c.format }), originTag(c.origin),
      el("span", { text: q.length + " due" })),
    el("div", { class: "q", text: c.prompt }));
  const out = el("div", { class: "status" });
  const done = (res) => {
    clear(out);
    out.appendChild(el("div", { class: res.review.grade === "pass" ? "pass" : "fail",
      text: res.review.grade === "pass" ? "PASS" : "FAIL" }));
    out.appendChild(el("div", { class: "quote", text: "source: " + res.answer + (res.source ? "  [from " + res.source + "]" : "") }));
    out.appendChild(el("div", { class: "row" }, el("button", { text: "Next", onclick: () => { current = null; next(); } })));
  };
  const fail = (e) => { out.appendChild(el("div", { class: "err", text: e.message })); };
  const send = (body, btns) => {
    btns.forEach(b => b.disabled = true);
    api("/api/review", Object.assign({ cid: c.cid, latencyMs: Date.now() - shownAt }, body))
      .then(done).catch(e => { btns.forEach(b => b.disabled = false); fail(e); });
  };
  if (c.format === "choice") {
    const btns = (c.options || []).map((o, i) => el("button", { class: "opt" },
      el("span", { class: "l", text: "abcd"[i] }), el("span", { text: o })));
    btns.forEach((b, i) => b.addEventListener("click", () => send({ answer: "abcd"[i] }, btns)));
    btns.forEach(b => card.appendChild(b));
  } else if (c.format === "recall") {
    const inp = el("input", { placeholder: "answer from memory, then reveal" });
    const rev = el("button", { text: "Reveal" });
    card.appendChild(el("div", { class: "row" }, inp, rev));
    rev.addEventListener("click", () => {
      rev.disabled = true; inp.disabled = true;
      api("/api/reveal", { cid: c.cid }).then(r => {
        card.appendChild(el("div", { class: "quote", text: "source quote: " + r.answer }));
        const rates = ["again", "hard", "good", "easy"].map(k => el("button", { text: k }));
        rates.forEach(b => b.addEventListener("click", () => send({ answer: inp.value, rating: b.textContent }, rates)));
        card.appendChild(el("div", { class: "row" }, ...rates));
      }).catch(e => { rev.disabled = false; inp.disabled = false; fail(e); });
    });
  } else {
    const inp = el("input", { placeholder: "your answer, in the words of the source" });
    const go = el("button", { text: "Check" });
    go.addEventListener("click", () => send({ answer: inp.value }, [go]));
    card.appendChild(el("div", { class: "row" }, inp, go));
  }
  card.appendChild(out);
  box.appendChild(card);
}

// The term map: one box per term, laid out left to right in the order the server sends them, a part-of arrow
// from each term to its parent. Same model in, same SVG out (no randomness, no layout engine).
function termMap(terms) {
  const ns = "http://www.w3.org/2000/svg", BW = 150, BH = 34, GAP = 40, H = BH + 20;
  const W = Math.max(1, terms.length) * (BW + GAP);
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "termmap"); svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  const pos = {};
  terms.forEach((t, i) => { pos[t.id] = 10 + i * (BW + GAP); });
  terms.forEach(t => {
    for (const p of (t.edges["part-of"] || [])) {
      if (pos[p] === undefined) continue;
      const a = pos[t.id] + BW, b = pos[p];
      const ln = document.createElementNS(ns, "line");
      const x1 = a < b ? a : pos[t.id], x2 = a < b ? b : pos[p] + BW;
      ln.setAttribute("x1", x1); ln.setAttribute("y1", 10 + BH / 2); ln.setAttribute("x2", x2); ln.setAttribute("y2", 10 + BH / 2);
      ln.setAttribute("stroke", "#3fb68b"); ln.setAttribute("stroke-width", "1.5");
      const tt = document.createElementNS(ns, "title"); tt.textContent = t.id + " part of " + p; ln.appendChild(tt);
      svg.appendChild(ln);
    }
  });
  terms.forEach(t => {
    const x = pos[t.id];
    const r = document.createElementNS(ns, "rect");
    r.setAttribute("x", x); r.setAttribute("y", 10); r.setAttribute("width", BW); r.setAttribute("height", BH);
    r.setAttribute("rx", 6); r.setAttribute("fill", "#0f1418"); r.setAttribute("stroke", "#e6edf3");
    const tx = document.createElementNS(ns, "text");
    tx.setAttribute("x", x + 8); tx.setAttribute("y", 10 + BH / 2 + 4); tx.setAttribute("fill", "#e6edf3");
    tx.setAttribute("font-size", "12"); tx.textContent = (t.id.length > 20 ? t.id.slice(0, 19) + "..." : t.id);
    const tt = document.createElementNS(ns, "title"); tt.textContent = t.id + " (" + t.type + ")";
    r.appendChild(tt); svg.appendChild(r); svg.appendChild(tx);
  });
  return svg;
}

// Waiting lessons per topic as bars; a click opens that topic's lesson (fleet learn lesson --topic T).
function waitingBars(waiting, onPick) {
  const ns = "http://www.w3.org/2000/svg", RH = 20, W = 520, max = Math.max(1, ...waiting.map(w => w.rows));
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "waiting"); svg.setAttribute("width", W); svg.setAttribute("height", waiting.length * RH + 4);
  waiting.forEach((w, i) => {
    const g = document.createElementNS(ns, "g"); g.style.cursor = "pointer";
    g.addEventListener("click", () => onPick(w.topic));
    const r = document.createElementNS(ns, "rect");
    r.setAttribute("x", 180); r.setAttribute("y", i * RH + 4); r.setAttribute("height", RH - 6);
    r.setAttribute("width", Math.max(2, (W - 220) * w.rows / max)); r.setAttribute("rx", 3);
    r.setAttribute("fill", w.heard ? "#e3b341" : "#3fb68b");
    const t = document.createElementNS(ns, "text");
    t.setAttribute("x", 0); t.setAttribute("y", i * RH + 16); t.setAttribute("fill", "#e6edf3"); t.setAttribute("font-size", "12");
    t.textContent = (w.topic.length > 26 ? w.topic.slice(0, 25) + "..." : w.topic) + " (" + w.rows + ")";
    const tt = document.createElementNS(ns, "title"); tt.textContent = w.topic + ": " + w.rows + " row(s), " + w.heard + " heard";
    g.appendChild(tt); g.appendChild(r); g.appendChild(t); svg.appendChild(g);
  });
  return svg;
}

let lessonTopic = null;
async function loadLesson() {
  const box = document.getElementById("lesson"); clear(box);
  let L;
  try { L = await api("/api/lessons" + (lessonTopic ? "?topic=" + encodeURIComponent(lessonTopic) : ""), null); }
  catch (e) { box.appendChild(el("div", { class: "err", text: e.message })); return; }
  if (L.waiting.length) box.appendChild(el("div", { class: "card" }, waitingBars(L.waiting, t => { lessonTopic = t; loadLesson(); })));
  if (!L.lesson) { box.appendChild(el("div", { class: "empty", text: "No new lessons. Cards come due only after their lesson." })); return; }
  box.appendChild(lessonCard(L.lesson, L.waiting.length + " topic(s) waiting", () => { lessonTopic = null; load(); }));
}

function lessonCard(m, note, afterSeen) {
  const card = el("div", { class: "card", id: "lesson-card" },
    el("div", { class: "top" }, el("span", { class: "id", text: m.topic }), el("span", { text: note })));
  card.appendChild(el("div", { class: "q", text: "Terms" }));
  if (m.terms.length) card.appendChild(termMap(m.terms));
  for (const t of m.terms) {
    card.appendChild(el("div", {}, el("b", { text: t.id + " (" + t.type + "): " }),
      el("span", { class: "quote", text: "\"" + t.definition + "\"" }), el("span", { class: "src", text: " [" + t.source + "]" })));
  }
  card.appendChild(el("div", { class: "q", text: "In context" }));
  for (const c of m.context) {
    const row = el("div", { class: "ctx", "data-lid": c.lid },
      el("span", { class: "id", text: c.lid + " " }),
      c.heard ? el("span", { class: "heardtag", text: "heard, not decided yet " }) : el("span", { text: c.kind + " " }),
      el("span", { class: "quote", text: "\"" + c.quote + "\"" }), el("span", { class: "src", text: " [" + c.source + "]" }));
    for (const ln of c.lines) {
      row.appendChild(el("div", { class: "dim", text: ln.field + ": " + ln.text + " \"" + ln.quote + "\" [" + c.source + "]" }));
    }
    card.appendChild(row);
  }
  if (m.dropped) card.appendChild(el("div", { class: "dim", text: m.dropped + " line(s) dropped (not backed by a quote)" }));
  const out = el("div", { class: "status" });
  const go = el("button", { text: "Seen: start the clock" });
  go.addEventListener("click", () => {
    go.disabled = true;
    api("/api/seen", { lids: m.lids }).then(() => afterSeen()).catch(e => { go.disabled = false; out.appendChild(el("div", { class: "err", text: e.message })); });
  });
  card.appendChild(el("div", { class: "row" }, go)); card.appendChild(out);
  return card;
}

// fleet learn session --topic T: T's lesson, then a quiz on T's cards only, then the one result line.
let sessionSince = null;
async function runSession(topic) {
  const body = document.getElementById("session-body"); clear(body);
  let S;
  try { S = await api("/api/session?topic=" + encodeURIComponent(topic) + (sessionSince ? "&since=" + encodeURIComponent(sessionSince) : ""), null); }
  catch (e) { body.appendChild(el("div", { class: "err", text: e.message })); return; }
  if (S.lesson) body.appendChild(lessonCard(S.lesson, "session lesson", () => runSession(topic)));
  const qb = el("div", { id: "session-quiz" }); body.appendChild(qb);
  if (S.quiz.length) renderQuiz(S.quiz, "session-quiz", () => runSession(topic));
  else if (!S.lesson) qb.appendChild(el("div", { class: "empty", text: "Nothing more on " + topic + "." }));
  body.appendChild(el("div", { class: "q", id: "session-line", text: S.line }));
}
document.getElementById("session-go").addEventListener("click", () => {
  const t = document.getElementById("session-topic").value.trim();
  if (!t) return;
  sessionSince = new Date().toISOString().replace(/\.\d+Z$/, "Z"); current = null; runSession(t);
});

function splitArgs(text) {
  const out = []; const re = /"([^"]*)"|'([^']*)'|(\S+)/g; let m;
  while ((m = re.exec(text))) out.push(m[1] !== undefined ? m[1] : m[2] !== undefined ? m[2] : m[3]);
  return out;
}
async function loadActions() {
  const sel = document.getElementById("pane-verb");
  if (sel.options.length) return;
  const A = await api("/api/actions", null);
  for (const v of A.cli) sel.appendChild(el("option", { text: v }));
}
document.getElementById("pane-go").addEventListener("click", () => {
  const out = document.getElementById("pane-out");
  const argv = [document.getElementById("pane-verb").value].concat(splitArgs(document.getElementById("pane-args").value));
  out.textContent = "running fleet learn " + argv.join(" ") + " ...";
  api("/api/cli", { argv }).then(r => { out.textContent = (r.out || "") + (r.err ? "\n" + r.err : "") + "\n(exit " + r.rc + ")"; load(); })
    .catch(e => { out.textContent = "error: " + e.message; });
});

async function load() {
  try {
    STATE = await api("/api/state");
    document.getElementById("meta").textContent = "as of " + STATE.snapshot.at;
    renderOrigins(STATE.snapshot); renderTopics(STATE); renderHeard(STATE.snapshot); renderRecent(STATE.snapshot);
    renderQuiz();
    await loadLesson();
    await loadActions();
  } catch (e) {
    document.getElementById("meta").textContent = "error: " + e.message;
  }
}
document.getElementById("reload").addEventListener("click", () => load());
load();
</script>
</body>
</html>
