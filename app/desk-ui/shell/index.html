<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet Desk</title>
<style>
  :root { color-scheme: dark; --bg:#0b1220; --card:#121b2e; --mint:#5eead4; --dim:#8aa0b8; --line:#1f2b44; }
  body { margin:0; background:var(--bg); color:#e6edf6; font: 14px -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h1 span { color: var(--mint); }
  p.sub { color: var(--dim); margin: 0 0 24px; }
  .desk { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#475569; flex:none; }
  .dot.up { background: var(--mint); }
  .desk .t { flex:1; } .desk .t b { display:block; } .desk code { color: var(--dim); font-size:12px; }
  button { background: var(--mint); color:#04211c; border:0; border-radius:8px; padding:7px 14px; font-weight:600; cursor:pointer; }
  button:disabled { background:#334155; color:#94a3b8; cursor:default; }
  kbd { color: var(--dim); font-size: 12px; margin-right: 6px; }
  pre { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; white-space:pre-wrap; color:#cbd5e1; }
  .err { color:#fca5a5; }
</style>
</head>
<body>
<main>
  <h1>Fleet <span>Desk</span></h1>
  <p class="sub">The live desk pages, unchanged. Every button here has a pane command next to it (the pane keeps the full text version).</p>
  <div id="desks">Starting the desk servers...</div>
  <h2 style="font-size:15px;margin-top:28px">From the phone</h2>
  <pre id="tunnel">fleet app tunnel</pre>
  <p id="err" class="err"></p>
</main>
<script>
const T = window.__TAURI__ && window.__TAURI__.core;
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  for (const k of kids) e.appendChild(k);
  return e;
}
async function load() {
  const box = document.getElementById("desks");
  if (!T) { box.textContent = "Open this page inside Fleet Desk."; return; }
  let list;
  try { list = await T.invoke("desks", { start: true }); }
  catch (e) { box.textContent = ""; document.getElementById("err").textContent = String(e); return; }
  box.textContent = "";
  for (const d of list) {
    const b = el("button", { text: "Open" });
    if (!d.alive) b.disabled = true;
    b.onclick = () => T.invoke("open_desk", { name: d.name }).catch(e => document.getElementById("err").textContent = String(e));
    box.appendChild(el("div", { class: "desk" },
      el("div", { class: "dot" + (d.alive ? " up" : "") }),
      el("div", { class: "t" }, el("b", { text: d.title }), el("code", { text: "pane: " + d.pane })),
      el("kbd", { text: "⌘" + d.key }), b));
  }
  try { document.getElementById("tunnel").textContent = await T.invoke("tunnel"); } catch (e) {}
}
load();
</script>
</body>
</html>
