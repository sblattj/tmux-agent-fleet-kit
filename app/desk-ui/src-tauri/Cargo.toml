[package]
name = "fleet-desk"
version = "0.1.0"
description = "Fleet Desk: the fleet desk pages in their own Mac window, with native notifications"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

